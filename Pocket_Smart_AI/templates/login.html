{% extends "base.html" %}

{% block title %}
Login · PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-card">

    <h1>
        Welcome back
    </h1>


    <form id="loginForm">

        <label>
            Email

            <input
                name="email"
                type="email"
                required
            >
        </label>


        <label>
            Password

            <input
                name="password"
                type="password"
                minlength="6"
                required
            >
        </label>


        <button class="btn">
            Login
        </button>


        <p id="message"></p>

    </form>


    <p>
        New user?

        <a href="/register">
            Create an account
        </a>
    </p>

</div>

{% endblock %}


{% block scripts %}

<script>

document
    .querySelector("#loginForm")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const form =
                new FormData(event.target);


            const response =
                await fetch(
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                Object.fromEntries(
                                    form
                                )
                            )
                    }
                );


            const data =
                await response.json();


            if (response.ok) {

                location.href =
                    "/dashboard";

            } else {

                document
                    .querySelector("#message")
                    .textContent =
                    data.detail ||
                    "Login failed";
            }
        }
    );

</script>

{% endblock %}
