{% extends "base.html" %}

{% block title %}
History · PocketSmart AI
{% endblock %}


{% block content %}

<h1>
    Recommendation History
</h1>


<div
    id="history"
    class="stack"
>
    Loading…
</div>

{% endblock %}


{% block scripts %}

<script>

(async function () {

    const response =
        await fetch(
            "/api/history"
        );


    if (!response.ok) {

        location.href =
            "/login";

        return;
    }


    const data =
        await response.json();


    const root =
        document.querySelector(
            "#history"
        );


    if (!data.length) {

        root.innerHTML = `
            <div class="card">
                No saved plans yet.
            </div>
        `;

        return;
    }


    root.innerHTML = "";


    data.forEach(function (item) {

        const card =
            document.createElement(
                "article"
            );


        card.className =
            "card";


        const heading =
            document.createElement(
                "h3"
            );


        heading.textContent =
            item.planner.toUpperCase()
            + " · "
            + item.created_at;


        const summary =
            document.createElement(
                "p"
            );


        summary.textContent =
            item.result.summary;


        const count =
            document.createElement(
                "p"
            );


        count.textContent =
            item.result
                .recommendations
                .length
            + " recommendations";


        card.appendChild(
            heading
        );

        card.appendChild(
            summary
        );

        card.appendChild(
            count
        );


        root.appendChild(
            card
        );

    });

})();

</script>

{% endblock %}
