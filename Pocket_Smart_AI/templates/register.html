{% extends "base.html" %}

{% block title %}
Register · PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-card">

    <h1>
        Create your account
    </h1>


    <form id="registerForm">

        <label>
            Name

            <input
                name="name"
                required
                minlength="2"
            >
        </label>


        <label>
            Email

            <input
                name="email"
                type="email"
                required
            >
        </label>


        <label>
            Password

            <input
                name="password"
                type="password"
                minlength="6"
                required
            >
        </label>


        <button class="btn">
            Register
        </button>


        <p id="message"></p>

    </form>


    <p>

        Already registered?

        <a href="/login">
            Login
        </a>

    </p>

</div>

{% endblock %}


{% block scripts %}

<script>

document
    .querySelector("#registerForm")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const form =
                new FormData(event.target);


            const response =
                await fetch(
                    "/api/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                Object.fromEntries(
                                    form
                                )
                            )
                    }
                );


            const data =
                await response.json();


            if (response.ok) {

                location.href =
                    "/dashboard";

            } else {

                document
                    .querySelector("#message")
                    .textContent =
                    data.detail ||
                    "Registration failed";
            }
        }
    );

</script>

{% endblock %}
